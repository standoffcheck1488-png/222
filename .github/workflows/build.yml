name: Build Eclips APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate fresh Android project
      run: |
        flutter create /tmp/eclips_fresh --project-name eclips --platforms android
        echo "=== Fresh project created ==="
        ls /tmp/eclips_fresh/android/

    - name: Copy fresh Android files
      run: |
        # Удаляем наш старый android-каркас
        rm -rf android
        # Копируем свежий от flutter create
        cp -r /tmp/eclips_fresh/android .
        echo "=== Copied fresh Android project ==="
        ls android/

    - name: Install dependencies
      run: flutter pub get

    - name: Add WireGuard dependency
      run: |
        echo "" >> android/app/build.gradle
        echo "dependencies {" >> android/app/build.gradle
        echo '    implementation("com.wireguard.android:tunnel:+")' >> android/app/build.gradle
        echo "}" >> android/app/build.gradle
        echo "=== WireGuard dep added ==="
        tail -5 android/app/build.gradle

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eclips-apk
        path: build/app/outputs/flutter-apk/app-release.apk
