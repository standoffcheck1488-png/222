name: Build Eclips APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Flutter project
      run: flutter create . --project-name eclips

    - name: Add MainActivity with openConfig
      run: |
        mkdir -p android/app/src/main/kotlin/com/example/eclips
        cat > android/app/src/main/kotlin/com/example/eclips/MainActivity.kt << 'EOF'
        package com.example.eclips

        import android.content.Intent
        import io.flutter.embedding.android.FlutterActivity
        import io.flutter.embedding.engine.FlutterEngine
        import io.flutter.plugin.common.MethodChannel

        class MainActivity : FlutterActivity() {
            private val CHANNEL = "com.eclips.app/vpn"

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                super.configureFlutterEngine(flutterEngine)
                MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                    .setMethodCallHandler { call, result ->
                        when (call.method) {
                            "openConfig" -> {
                                val config = call.argument<String>("config") ?: ""
                                val send = Intent(Intent.ACTION_SEND)
                                send.type = "text/plain"
                                send.putExtra(Intent.EXTRA_TEXT, config)
                                startActivity(Intent.createChooser(send, "Открыть в WireGuard"))
                                result.success(true)
                            }
                            else -> result.notImplemented()
                        }
                    }
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eclips-apk
        path: build/app/outputs/flutter-apk/app-release.apk
