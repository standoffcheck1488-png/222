name: Build Eclips APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create build project
      run: |
        flutter create /tmp/eclips_build --project-name eclips --platforms android
        echo "=== Fresh project created ==="

    - name: Copy our code to build project
      run: |
        rm -rf /tmp/eclips_build/lib
        cp -r lib /tmp/eclips_build/
        cp pubspec.yaml /tmp/eclips_build/
        cp android/app/src/main/AndroidManifest.xml /tmp/eclips_build/android/app/src/main/AndroidManifest.xml
        mkdir -p /tmp/eclips_build/android/app/src/main/kotlin/com/example/eclips
        cp android/app/src/main/kotlin/com/example/eclips/MainActivity.kt /tmp/eclips_build/android/app/src/main/kotlin/com/example/eclips/MainActivity.kt
        echo "=== Our code copied ==="

    - name: Install dependencies
      run: |
        cd /tmp/eclips_build
        flutter pub get

    - name: Add WireGuard dependency
      run: |
        echo "" >> /tmp/eclips_build/android/app/build.gradle
        echo "dependencies {" >> /tmp/eclips_build/android/app/build.gradle
        echo '    implementation("com.wireguard.android:tunnel:+")' >> /tmp/eclips_build/android/app/build.gradle
        echo "}" >> /tmp/eclips_build/android/app/build.gradle
        echo "=== WireGuard dep added ==="

    - name: Build APK
      run: |
        cd /tmp/eclips_build
        flutter build apk --release
        echo "=== APK built ==="

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eclips-apk
        path: /tmp/eclips_build/build/app/outputs/flutter-apk/app-release.apk
