name: Build Eclips APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Add gradle wrapper
      run: |
        mkdir -p android/gradle/wrapper
        curl -fsSL -o android/gradlew https://raw.githubusercontent.com/flutter/flutter/stable/examples/hello_world/android/gradlew
        curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/flutter/flutter/stable/examples/hello_world/android/gradle/wrapper/gradle-wrapper.jar
        chmod +x android/gradlew

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eclips-apk
        path: build/app/outputs/flutter-apk/app-release.apk
