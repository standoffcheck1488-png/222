name: Build Eclips APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Backup our files
      run: |
        mkdir -p /tmp/backup
        cp pubspec.yaml /tmp/backup/
        cp -r lib /tmp/backup/
        cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
        cp android/app/src/main/kotlin/com/example/eclips/MainActivity.kt /tmp/backup/MainActivity.kt
        echo "=== Files backed up ==="

    - name: Wipe old android folder
      run: |
        rm -rf android
        echo "=== Old android removed ==="

    - name: Create Flutter project
      run: |
        flutter create . --project-name eclips --platforms android --overwrite
        echo "=== Flutter project created ==="
        ls android/
        ls android/app/

    - name: Restore our files
      run: |
        cp /tmp/backup/pubspec.yaml .
        rm -rf lib
        cp -r /tmp/backup/lib .
        cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
        mkdir -p android/app/src/main/kotlin/com/example/eclips
        cp /tmp/backup/MainActivity.kt android/app/src/main/kotlin/com/example/eclips/MainActivity.kt
        echo "=== Our files restored ==="

    - name: Install dependencies
      run: flutter pub get

    - name: Add WireGuard dependency
      run: |
        echo "" >> android/app/build.gradle
        echo "dependencies {" >> android/app/build.gradle
        echo '    implementation("com.wireguard.android:tunnel:+")' >> android/app/build.gradle
        echo "}" >> android/app/build.gradle
        echo "=== WireGuard dep added ==="
        tail -5 android/app/build.gradle

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eclips-apk
        path: build/app/outputs/flutter-apk/app-release.apk
